<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GlowCraft | Wishlist & Compare</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/wishlist-compare.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">GlowCraft</div>
  </header>

  <div class="container dual-grid">
    <div class="card-section">
      <h2>My Wishlist</h2>
      <div id="wishlist-list">
        <p>Wishlist items load here...</p>
      </div>
    </div>

    <div class="card-section">
      <h2>Compare Products</h2>
      <table class="compare-table">
        <tr>
          <th>Feature</th>
          <th>Vitamin C Serum</th>
          <th>Moisturizing Cream</th>
        </tr>
        <tr>
          <td>Price</td>
          <td>$24.99</td>
          <td>$18.99</td>
        </tr>
        <tr>
          <td>Skin Type</td>
          <td>Oily</td>
          <td>Dry</td>
        </tr>
      </table>
    </div>
  </div>

</body>
</html>
